name: Nix
permissions:
  contents: read
"on":
  workflow_call:
    inputs:
      cachix-name:
        type: string
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      OPERATOR_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      cachix-name:
        type: string
        default: ""
        description: Cachix cache name
jobs:
  checks:
    name: Checks
    if: ${{ needs['setup-checks-jobs'].outputs.continue == 'true' }}
    runs-on: ${{ matrix.runner }}
    needs:
      - setup-checks-jobs
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs['setup-checks-jobs'].outputs.matrix) }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      # Pin Nix to 2.34.8. The shikanime-studio setup@v9 wrapper floats
      # cachix/install-nix-action@v31 (currently 2.35.1), whose FOD
      # narHash verification regresses with devenv's locked nixpkgs fetch
      # ("public key is not valid"). v31.10.7 ships 2.34.8; install_url
      # makes the pin explicit and deterministic.
      # Related: t_de8c05dd
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-system-features = kvm
          github_access_token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - name: Push to Cachix
        if: ${{ env.HAS_CACHIX != '' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ inputs['cachix-name'] }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        env:
          HAS_CACHIX:
            ${{ inputs['cachix-name'] != '' && secrets.CACHIX_AUTH_TOKEN != ''
            }}
      - uses: shikanime-studio/actions/checkout@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: direnv
        uses: shikanime-studio/actions/direnv@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
      - name: Run flake check
        run:
          nix flake check --accept-flake-config --no-pure-eval --system "${{
          matrix.system }}"
        shell: bash
  packages:
    name: Packages
    if: ${{ needs['setup-packages-jobs'].outputs.continue == 'true' }}
    runs-on: ${{ matrix.runner }}
    needs:
      - setup-packages-jobs
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs['setup-packages-jobs'].outputs.matrix) }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      # See checks job: pin Nix to 2.34.8.
      # Related: t_de8c05dd
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-system-features = kvm
          github_access_token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - name: Push to Cachix
        if: ${{ env.HAS_CACHIX != '' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ inputs['cachix-name'] }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        env:
          HAS_CACHIX:
            ${{ inputs['cachix-name'] != '' && secrets.CACHIX_AUTH_TOKEN != ''
            }}
      - uses: shikanime-studio/actions/checkout@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: direnv
        uses: shikanime-studio/actions/direnv@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
      - uses: shikanime-studio/actions/nix/integration@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          name: ${{ matrix.name }}
          system: ${{ matrix.system }}
  setup-checks-jobs:
    name: Setup Checks Jobs
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.setup-checks-jobs.outputs.continue }}
      matrix: ${{ steps.setup-checks-jobs.outputs.matrix }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      # See checks job: pin Nix to 2.34.8.
      # Related: t_de8c05dd
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-system-features = kvm
          github_access_token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - uses: shikanime-studio/actions/checkout@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: setup-checks-jobs
        uses: shikanime-studio/actions/nix/setup-checks-jobs@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
  setup-packages-jobs:
    name: Setup Packages Jobs
    runs-on: ubuntu-latest
    needs:
      - checks
    outputs:
      continue: ${{ steps.setup-packages-jobs.outputs.continue }}
      matrix: ${{ steps.setup-packages-jobs.outputs.matrix }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.OPERATOR_APP_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      # See checks job: pin Nix to 2.34.8.
      # Related: t_de8c05dd
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-system-features = kvm
          github_access_token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
      - uses: shikanime-studio/actions/checkout@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: setup-packages-jobs
        uses: shikanime-studio/actions/nix/setup-packages-jobs@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
